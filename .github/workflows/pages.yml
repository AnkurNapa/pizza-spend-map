name: Build and deploy Pizza Spend Map

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 1 * *"   # 1st of each month: re-pull FSA and OpenStreetMap competitors
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install shapely==2.0.7 pyproj==3.6.1 openpyxl
      - name: Build (refresh competitors on the monthly run)
        run: python scripts/build.py ${{ github.event_name != 'push' && '--refresh-competitors' || '' }}
      - name: Commit refreshed data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data/raw/competitors data/raw/fetched.json
          git diff --cached --quiet || git commit -m "data: monthly competitor refresh" && git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
